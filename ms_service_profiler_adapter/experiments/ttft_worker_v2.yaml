name: ttft_worker_v2
profile:
  prof_dir: ./profiles/{experiment}/{node}
  acl_task_time: 0
  acl_prof_task_time_level: ""
  timelimit: 1200
# Optional, version-specific additions. The base is copied from the installed
# ms_service_profiler package, so default request/batch hooks are retained.
symbols:
  add:
    - symbol: vllm_ascend.worker.worker:NPUWorker.execute_model
      domain: ModelExecute
      name: worker_execute_model
      attributes:
        - name: scheduled_tokens_by_request
          expr: str(scheduler_output.num_scheduled_tokens)
    - symbol: vllm_ascend.worker.v2.model_runner:NPUModelRunner.execute_model
      domain: ModelExecute
      name: model_runner_v2_execute
      attributes:
        - name: scheduled_tokens_by_request
          expr: str(scheduler_output.num_scheduled_tokens)
