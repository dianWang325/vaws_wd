# Profiler symbols are per process; the DP2/PP2/TP8 topology is set by glm52_dsacp_V2.sh.
# Use this experiment name to keep its traces separate from the DP1 baseline.
name: glm52_dp2_pp2_tp8_dsacp_ttft
profile:
  prof_dir: ./profiles/{experiment}/{node}
  acl_task_time: 0
  acl_prof_task_time_level: ""
  timelimit: 0

symbols:
  add:
    - symbol: vllm_ascend.worker.worker:NPUWorker.execute_model
      domain: ModelExecute
      name: worker_execute_model
      attributes:
        - name: scheduled_tokens_by_request
          expr: "str(args[1].num_scheduled_tokens)"
        - name: total_num_scheduled_tokens
          expr: "args[1].total_num_scheduled_tokens"

    - symbol: vllm_ascend.worker.v2.model_runner:NPUModelRunner.execute_model
      domain: ModelExecute
      name: model_runner_v2_execute
      attributes:
        - name: scheduled_tokens_by_request
          expr: "str(args[1].num_scheduled_tokens)"
        - name: total_num_scheduled_tokens
          expr: "args[1].total_num_scheduled_tokens"
